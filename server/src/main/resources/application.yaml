spring:
  application:
    name: server

  datasource:
    url: jdbc:postgresql://localhost:5432/icu
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: icu-group
      auto-offset-reset: earliest

app:
  kafka:
    topics:
      telemetry: icu.telemetry
      vitals-5m: icu.vitals.5m
      alerts: icu.alerts
      dead-letter: icu.deadletter

  ws:
    endpoint: /ws
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:3000
      - http://127.0.0.1:3000
    heartbeat: 10s
    telemetry-flush: 500ms
    message-size-limit: 64KB
    send-buffer-limit: 512KB
    send-timeout: 10s