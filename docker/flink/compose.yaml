name: icu-flink
x-common: &common
  image: icu-pyflink:2.3.0-kafka5.0.0-2.2-v2
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - streaming
  environment: &environment
    KAFKA_BOOTSTRAP_SERVERS: icu-kafka:9094
    ICU_PATIENT_CONFIG: /opt/flink/config/demo_patients.yaml
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      rest.address: jobmanager
      rest.bind-address: 0.0.0.0
      taskmanager.numberOfTaskSlots: 1
      parallelism.default: 1
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: 2048m
      python.executable: /opt/pyflink/bin/python
      python.client.executable: /opt/pyflink/bin/python
      execution.checkpointing.interval: 10s
      execution.checkpointing.storage: filesystem
      execution.checkpointing.dir: file:///opt/flink/checkpoints
  volumes:
    - ../../jobs/flink:/opt/flink/jobs:ro
    - ../../config/demo_patients.yaml:/opt/flink/config/demo_patients.yaml:ro
    - checkpoints:/opt/flink/checkpoints

services:
  jobmanager:
    <<: *common
    container_name: icu-flink-jobmanager
    command: jobmanager
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/overview"]
      interval: 5s
      timeout: 3s
      retries: 20
  taskmanager:
    <<: *common
    container_name: icu-flink-taskmanager
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: icu-kafka-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ICU-LOCAL
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: icu-kafka:9094
      KAFKA_CLUSTERS_0_READONLY: "true"
    networks:
      - streaming
  realtime-gateway:
    image: icu-realtime-gateway:v2
    build:
      context: ../..
      dockerfile: services/realtime_gateway/Dockerfile
    container_name: icu-realtime-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: icu-kafka:9094
    networks:
      - streaming
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg17
    container_name: icu-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - streaming
  storage-writer:
    image: icu-storage-writer:v1
    build:
      context: ../..
      dockerfile: services/storage_writer/Dockerfile
    container_name: icu-storage-writer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: icu-kafka:9094
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TIMESCALE_HOST: icu-timescaledb
      TIMESCALE_PORT: 5432
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/icu-writer-ready && kill -0 1 && python -c 'import psycopg; from services.storage_writer.config import db_params; psycopg.connect(**db_params()).close()'"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - streaming

networks:
  streaming:
    external: true
    name: icu-streaming
volumes:
  checkpoints:
    name: icu-flink-checkpoints
  timescale-data:
    name: icu-timescale-data
